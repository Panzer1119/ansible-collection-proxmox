---
- name: "Flatten snapshot tree in pvemanagerlib.js (PVE 8.x, 9.x)"
  replace:
    path: "/usr/share/pve-manager/js/pvemanagerlib.js"
    regexp: 'if \(item\.parent && idhash\[item\.parent\]\) {'
    replace: "if (item.parent && idhash[item.parent] && false) {"
    backup: true
  when: (skip_version_check | default(false) | bool) or (pve_version is version('8.2', '>=') and pve_version is version('10.0', '<'))
  notify: "Restart PVE Proxy"
...
